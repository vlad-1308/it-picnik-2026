<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0c"><title>Восстановление ИТ-Пикника</title><style>body{margin:0;background:#0b0b0c;color:#f7f7f8;font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.box{max-width:430px;background:#171719;border:1px solid #303035;border-radius:20px;padding:20px}h1{font-size:22px;margin:8px 0}p{color:#b8b8c0}.ok{color:#79e39a}.btn{display:block;margin-top:12px;padding:13px;border-radius:13px;background:#ff7a00;color:#111;text-align:center;text-decoration:none;font-weight:900}</style></head><body><div class="box"><div style="font-size:30px">🔧</div><h1>Очистка старой PWA</h1><p id="status">Отключаю старый service worker и удаляю его кэш…</p><a id="open" class="btn" href="./live.html?v=20260808-live15" style="display:none">Открыть рабочую версию</a></div><script>(async()=>{const s=document.getElementById('status'),b=document.getElementById('open');try{if('serviceWorker'in navigator){try{const r=await navigator.serviceWorker.register('./sw.js?v=kill15',{scope:'./',updateViaCache:'none'});try{await r.update()}catch(e){}}catch(e){}const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('it-picnik-2026-')).map(k=>caches.delete(k)));}s.innerHTML='<span class="ok">Готово.</span> Старый PWA-кэш отключён. Открой рабочую live-версию кнопкой ниже.';}catch(e){s.textContent='Очистка завершилась с предупреждением, но live-версия всё равно доступна.'}b.style.display='block';})();</script></body></html>
