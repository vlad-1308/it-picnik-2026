<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0c"><title>Восстановление ИТ-Пикника</title><style>body{margin:0;background:#0b0b0c;color:#f7f7f8;font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.box{max-width:420px;background:#171719;border:1px solid #303035;border-radius:20px;padding:20px}.spin{font-size:30px}h1{font-size:22px;margin:8px 0}p{color:#b8b8c0}.ok{color:#ffb673;font-weight:700}</style></head><body><div class="box"><div class="spin">🔧</div><h1>Восстанавливаю приложение</h1><p id="status">Удаляю старый кэш и service worker…</p><p class="ok">Страница сама вернётся в ИТ‑Пикник.</p></div><script>(async()=>{const s=document.getElementById('status');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('it-picnik-2026-')).map(k=>caches.delete(k)));}s.textContent='Готово. Загружаю свежую версию…';setTimeout(()=>location.replace('./?fresh=20260808-v14'),500);}catch(e){s.textContent='Кэш очищен не полностью. Всё равно пробую открыть свежую версию…';setTimeout(()=>location.replace('./?fresh=20260808-v14'),900);}})();</script></body></html>
